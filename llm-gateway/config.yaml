# MigrationGuard gateway — provider registry.
#
# This file is DATA, not code. It is the whole answer to "how do you add a
# model?" — you add a block here. No handler changes, no redeploy of logic.
# In Phase C this becomes a Kubernetes ConfigMap, which is what makes the
# live swap in the demo work.
#
# Policy lives in policy.yaml, NOT here. This file says what EXISTS;
# policy.yaml says what is ALLOWED. Keeping them apart is deliberate:
# one is an inventory, the other is a control.
#
# See ARCHITECTURE.md section 2 (control plane) and section 11 (contracts).

version: 1

# Used when the caller names no provider and policy allows more than one.
# THE DEMO MOMENT: change this one line, the entire backend swaps, and no
# application code is touched.
default_provider: local

providers:

  # ---------------------------------------------------------------- on-prem
  # Drafting model. Chosen by benchmark on 2026-11-09, not by preference:
  # 6.3s median / 8.5 tok/s on this host, and it answers instead of
  # narrating. qwen3:4b was rejected - it reasons out loud and ignores
  # both think=False and /no_think. See ARCHITECTURE.md section 12.
  local:
    type: ollama
    model: llama3.2:3b
    # ONE config file for both environments. On the host the default applies;
    # in Compose we set OLLAMA_BASE_URL=http://host.docker.internal:11434,
    # because Ollama deliberately runs OUTSIDE the container network.
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}
    zone: onprem
    cost_per_1k: 0.0          # local inference has no marginal $ cost
    timeout_s: 120

  # Safety classifier. Returns "safe", or "unsafe" plus a hazard category.
  # Measured 2.2s warm for a verdict. It is a CONTENT-SAFETY model, not a
  # dedicated injection detector - the heuristic scanner stays as a second
  # layer. See ARCHITECTURE.md section 13.
  guard:
    type: ollama
    model: llama-guard3:1b
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}
    zone: onprem
    cost_per_1k: 0.0
    timeout_s: 60

  # ------------------------------------------------------------------ cloud
  # The genuinely remote leg. Reachable ONLY when policy allows it, which
  # means: no PII in the payload, and the classifier is healthy.
  # The API key is read from the ANTHROPIC_API_KEY environment variable and
  # is never written here.
  claude:
    type: anthropic
    model: claude-sonnet-5-5
    zone: cloud
    cost_per_1k: 0.003        # non-zero is the point: it makes routing a real choice
    max_tokens: 1024
    timeout_s: 120

# --------------------------------------------------------------------------
# PII CLASSIFIER — the compliance layer, and it is plug-and-play too.
#
#   regex      structured identifiers only. Zero deps, CANNOT detect names.
#   presidio   spaCy NER. Detects PERSON/LOCATION. Separate process, killable.
#   composite  runs both and UNIONS their findings.
#
# Why composite is the default: regex catches ACCOUNT_NUMBER, for which
# Presidio has no built-in recogniser; Presidio catches PERSON, which regex
# structurally cannot. A real support message contains both, so neither is
# sufficient alone.
#
# require_all_healthy: if ANY member is down the composite reports unhealthy,
# which fires the fail-closed rule. Reporting healthy because "one of them
# still works" would quietly reopen the hole.
# --------------------------------------------------------------------------
classifier:
  type: composite
  members: [regex, presidio]
  url: ${PRESIDIO_URL:-http://127.0.0.1:8001}
  timeout_s: 2.0
  require_all_healthy: true

# --------------------------------------------------------------------------
# GUARDRAILS - also plug-and-play, and also layered for a MEASURED reason.
#
# llama-guard3:1b was probed against eight attacks on this machine. It
# flagged four and let four through: the four carrying no harmful content
# ("print your system prompt", "what is your API key"). It is a HARM
# classifier, not an injection detector - two different questions.
#
# So the input chain asks both questions:
#   injection     structural hijack patterns. ~0ms. 18/18 on the probe set.
#   safety_model  llama-guard3:1b for harmful content. ~2s per call.
#
# safety_model is the expensive half. Set enabled:false to measure the
# gateway without it - the load test does exactly that to price the
# safety layer.
# --------------------------------------------------------------------------
guardrails:
  input:
    - type: injection
    - type: safety_model
      provider: guard
      enabled: true
      max_tokens: 24
      # Hazard categories the model may flag WITHOUT blocking the request.
      #
      # S7 is "Privacy". The model raises it whenever a message contains
      # personal information, which is true of most real support traffic: a
      # load test measured 8 false alarms in 12 ordinary customer messages,
      # every one S7, every one a customer receiving HTTP 400.
      #
      # It is also redundant. The PII classifier below exists to find
      # personal data, and the routing policy already keeps those requests
      # on-prem. Two controls with overlapping scope, and the cruder one was
      # vetoing the request the precise one was handling correctly.
      #
      # The flag is still recorded in the audit trail. Set this to [] to make
      # every category block again - that is a policy choice, so it lives
      # here rather than in the code.
      advisory_categories: ["S7"]
  output:
    - type: format
      max_sentences: 4

# Where the gateway writes its inference events.
# One record per call: who answered, which zone, which rules fired, which
# guardrails tripped, every fallback hop, latency, tokens and cost.
# This file IS the audit trail and the cost ledger.
# Swapped for a Kafka producer at checkpoint 4; the schema does not change.
events:
  sink: file
  path: events.jsonl

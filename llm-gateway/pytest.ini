[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --tb=short

# Every test is tagged twice: by SCENARIO id (traceability to SCENARIOS.md)
# and by CATEGORY (so a slice can be run live in front of someone).
#
#   pytest -m governance -v
#   pytest -m security -v
#   pytest -k SC01 -v
markers =
    scenario(id): the SCENARIOS.md id this test proves, e.g. SC-01
    governance: data residency, auditability, refusal behaviour
    security: authentication, caller-supplied overrides, abuse
    resilience: fallback, error taxonomy, degradation
    performance: deadlines, load shedding, latency bounds
    cost: routing economics and the ledger
    architecture: pattern guarantees (Adapter / Factory / Strategy)
    reliability: startup validation
    operability: live reload
    quality: output drift and reply-format guardrails
    slow: hits a real model; excluded by default in CI
